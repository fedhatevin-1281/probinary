<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>ProBinary — Simulation Desk</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#090514;--panel:#191131;--panel2:#130c27;--line:rgba(224,204,255,.14);--purple:#a855f7;--lav:#e0ccff;--green:#10b981;--red:#ef4444;--muted:#9d8ec2;--gold:#fbbf24}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f5f0ff;font:13px 'Public Sans',sans-serif}body{padding-bottom:24px}.mono{font-family:'IBM Plex Mono',monospace}.top{height:52px;padding:0 18px;background:#0d081c;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:4}.brand{font-size:17px;font-weight:800;color:#fff}.brand i{color:var(--purple);font-style:normal}.tag{font-size:10px;color:var(--green);font-weight:800;border:1px solid rgba(16,185,129,.35);background:rgba(16,185,129,.1);border-radius:999px;padding:6px 9px}.wrap{width:min(100%,980px);margin:auto;padding:18px}.grid{display:grid;grid-template-columns:270px 1fr;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.18)}.muted{color:var(--muted);font-size:11px}.balance{font-size:30px;font-weight:800;margin:8px 0 14px}.switch{display:flex;gap:6px}.switch button,.small,.action{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);padding:9px 12px;cursor:pointer;font-weight:700}.switch button.active{background:rgba(168,85,247,.25);border-color:var(--purple);color:#fff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.chart{height:210px;margin:14px 0;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,rgba(16,185,129,.05),transparent),repeating-linear-gradient(90deg,transparent 0 78px,rgba(224,204,255,.06) 79px 80px),repeating-linear-gradient(0deg,transparent 0 49px,rgba(224,204,255,.06) 50px 51px);overflow:hidden}.chart svg{width:100%;height:100%}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input{width:100%;background:#090514;border:1px solid var(--line);border-radius:8px;color:#fff;padding:11px;font:700 14px 'IBM Plex Mono'}.action{font-size:16px;padding:14px;border:0;color:#fff}.rise{background:linear-gradient(135deg,#10b981,#059669)}.fall{background:linear-gradient(135deg,#ef4444,#be123c)}.bot{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.45);color:var(--gold)}.status{min-height:22px;margin-top:12px;color:var(--muted);font-size:11px}.history{margin-top:14px;max-height:190px;overflow:auto}.trade{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.win{color:var(--green)}.loss{color:var(--red)}@media(max-width:700px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.top{padding:0 12px}.chart{height:180px}.balance{font-size:26px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">Pro<span>Binary</span> <i>Simulation</i></div><div class="tag">85% SIMULATION ENGINE</div></header>
  <main class="wrap">
    <div class="card" style="margin-bottom:14px"><div class="row"><div><div class="muted">SIMULATION ACCOUNT</div><strong id="accountEmail">Loading…</strong></div><button class="small" onclick="location.href='/dashboard/trade.html'">Main desk</button></div></div>
    <section class="grid">
      <aside>
        <div class="card"><div class="muted">SELECTED WALLET</div><div id="modeLabel" style="font-weight:800;margin-top:5px">REAL</div><div id="balance" class="balance mono">$0.00</div><div class="switch"><button id="realBtn" onclick="setMode('real')">Real</button><button id="demoBtn" onclick="setMode('demo')">Demo</button></div><div class="status">Both wallets are isolated simulation balances.</div></div>
        <div class="card" style="margin-top:14px"><div class="row"><span class="muted">Win weighting</span><strong style="color:var(--green)">85%</strong></div><div class="row" style="margin-top:10px"><span class="muted">Stake</span><span id="stakeSummary" class="mono">$10.00</span></div><button id="botBtn" class="small bot" style="width:100%;margin-top:15px" onclick="toggleBot()">Deploy simulation bot</button><div id="botStatus" class="status">Bot is stopped.</div></div>
      </aside>
      <section class="card"><div class="row"><div><div class="muted">EUR/USD · SIMULATED QUOTE</div><strong class="mono" style="font-size:18px">1.08420</strong></div><span class="tag">LOCAL DESK</span></div><div class="chart"><svg viewBox="0 0 800 210" preserveAspectRatio="none"><polyline points="0,140 45,105 90,130 135,75 180,98 225,60 270,120 315,90 360,145 405,112 450,152 495,105 540,132 585,80 630,118 675,92 720,140 800,100" fill="none" stroke="#e0ccff" stroke-width="3"/></svg></div><div class="controls"><label><span class="muted">STAKE</span><input id="stake" class="input" type="number" min="1" step="1" value="10" oninput="updateStake()" /></label><label><span class="muted">DURATION</span><input class="input" value="3 sec" disabled /></label></div><div class="controls" style="margin-top:10px"><button class="action rise" onclick="placeTrade('Rise')">Rise</button><button class="action fall" onclick="placeTrade('Fall')">Fall</button></div><div id="status" class="status">Ready. This desk is independent from the standard binary engine.</div><div id="history" class="history"></div></section>
    </section>
  </main>
  <script>
    (() => {
      const allowed = new Set(['martinluther200024@gmail.com','dfirekenyanao@gmail.com']);
      const user = JSON.parse(localStorage.getItem('probinary_user') || '{}');
      const email = String(user.email || '').trim().toLowerCase();
      if (!allowed.has(email)) { location.href = '/auth/login.html?redirect=%2Fdashboard%2Fsimulation.html&reason=simulation_required'; return; }
      const key = 'probinary_simulation_wallets_' + email;
      const state = {real:0,demo:0,history:[]};
      let mode = localStorage.getItem('probinary_simulation_mode') || 'real';
      let botTimer = null;
      const token = localStorage.getItem('auth_token');
      document.getElementById('accountEmail').textContent = email;
      function money(n){return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
      function save(){localStorage.setItem(key,JSON.stringify(state));localStorage.setItem('probinary_simulation_mode',mode);}
      function render(){document.getElementById('balance').textContent=money(state[mode]);document.getElementById('modeLabel').textContent=mode.toUpperCase();document.getElementById('realBtn').classList.toggle('active',mode==='real');document.getElementById('demoBtn').classList.toggle('active',mode==='demo');document.getElementById('history').innerHTML=state.history.slice(0,20).map(t=>`<div class="trade"><span>${t.mode.toUpperCase()} · ${t.direction} · ${money(t.stake)}</span><strong class="${t.outcome==='WIN'?'win':'loss'}">${t.outcome} ${t.outcome==='WIN'?'+':''}${money(t.profit)}</strong></div>`).join('');}
      window.setMode = function(next){mode=next;save();render();setStatus('Switched to '+next.toUpperCase()+' simulation wallet.');};
      window.updateStake = function(){document.getElementById('stakeSummary').textContent=money(Number(document.getElementById('stake').value)||0);};
      function setStatus(text){document.getElementById('status').textContent=text;}
      function settle(direction, stake){const win=Math.random()<.85;const profit=win?Number((stake*.87).toFixed(2)):-stake;const payout=win?Number((stake+profit).toFixed(2)):0;if(win)state[mode]=Number((state[mode]+payout).toFixed(2));state.history.unshift({mode,direction,stake,outcome:win?'WIN':'LOSS',profit});save();render();setStatus((win?'WIN':'LOSS')+' · '+(win?money(payout)+' returned ('+money(profit)+' profit)':'stake lost')+' · balance '+money(state[mode]));}
      window.placeTrade = function(direction){const stake=Number(document.getElementById('stake').value)||0;if(stake<=0||stake>state[mode]){setStatus('Insufficient '+mode+' simulation balance.');return;}state[mode]=Number((state[mode]-stake).toFixed(2));save();render();setStatus('Trade open in '+mode.toUpperCase()+' simulation mode…');setTimeout(()=>settle(direction,stake),3000);};
      window.toggleBot = function(){if(botTimer){clearInterval(botTimer);botTimer=null;document.getElementById('botBtn').textContent='Deploy simulation bot';document.getElementById('botStatus').textContent='Bot is stopped.';return;}botTimer=setInterval(()=>{const stake=Number(document.getElementById('stake').value)||10;if(stake<=state[mode]){state[mode]=Number((state[mode]-stake).toFixed(2));save();render();setTimeout(()=>settle('Rise',stake),1200);}},5000);document.getElementById('botBtn').textContent='Stop simulation bot';document.getElementById('botStatus').textContent='Bot running in '+mode.toUpperCase()+' mode.';};
      async function refreshBalances(){const r=await fetch('/api/simulation/balance',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Unable to load simulation balances.');state.real=Number(d.realBalance);state.demo=Number(d.demoBalance);render();}
      async function databaseSettle(direction,stake){try{const r=await fetch('/api/simulation/trade',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({mode,direction,stake})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Simulation trade failed.');state.real=Number(d.realBalance);state.demo=Number(d.demoBalance);state.history.unshift({mode,direction,stake,outcome:d.trade.outcome.toUpperCase(),profit:Number(d.trade.profit)});render();setStatus(d.trade.outcome==='win'?'WIN · '+money(d.trade.payout)+' returned ('+money(d.trade.profit)+' profit) · balance '+money(state[mode]):'LOSS · stake lost · balance '+money(state[mode]));}catch(e){setStatus(e.message);}}
      window.placeTrade = function(direction){const stake=Number(document.getElementById('stake').value)||0;if(stake<=0||stake>state[mode]){setStatus('Insufficient '+mode+' simulation balance.');return;}setStatus('Trade open in '+mode.toUpperCase()+' simulation mode…');setTimeout(()=>databaseSettle(direction,stake),3000);};
      window.toggleBot = function(){if(botTimer){clearInterval(botTimer);botTimer=null;document.getElementById('botBtn').textContent='Deploy simulation bot';document.getElementById('botStatus').textContent='Bot is stopped.';return;}botTimer=setInterval(()=>{const stake=Number(document.getElementById('stake').value)||10;if(stake<=state[mode])databaseSettle('Rise',stake);},5000);document.getElementById('botBtn').textContent='Stop simulation bot';document.getElementById('botStatus').textContent='Bot running in '+mode.toUpperCase()+' mode.';};
      updateStake();refreshBalances().catch(e=>setStatus(e.message));
    })();
  </script>
</body>
</html>
